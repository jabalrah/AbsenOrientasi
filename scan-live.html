<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Live Scanner Absensi</title>
<style>
  :root { --primary: #1a73e8; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    margin: 0; background: #111; color: #eee;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- LOGIN ---------- */
  #loginBox {
    max-width: 340px; margin: 80px auto; text-align: center;
    background: #1c1c1c; padding: 24px; border-radius: 14px;
  }
  #loginBox h2 { margin-top: 0; }
  #loginBox input, #loginBox select {
    width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px;
    font-size: 16px; margin: 10px 0; background: #262626; color: #eee;
  }
  #loginError { color: #ff6b6b; font-size: 13px; min-height: 18px; }
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 8px;
    font-size: 16px; font-weight: 700; cursor: pointer; color: #fff;
    background: var(--primary);
  }
  .btn:disabled { background: #444; cursor: not-allowed; }

  /* ---------- SCANNER ---------- */
  #scannerApp { display: none; height: 100dvh; display: flex; flex-direction: column; }
  #topBar {
    padding: 10px 14px; background: #1c1c1c; display: flex; gap: 8px;
    flex-wrap: wrap; align-items: center;
  }
  #topBar select {
    flex: 1; min-width: 120px; padding: 10px; border-radius: 8px;
    border: 1px solid #333; background: #262626; color: #eee; font-size: 14px;
  }
  #topBar .counter {
    font-size: 13px; color: #aaa; white-space: nowrap; padding: 0 6px;
  }
  #topBar .counter b { color: #fff; font-size: 16px; }

  #cameraWrap {
    position: relative; flex: 1; overflow: hidden; background: #000;
  }
  #video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  #scanFrame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 68vw; max-width: 320px; aspect-ratio: 1/1;
    border: 3px solid rgba(255,255,255,0.85); border-radius: 16px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.35);
    pointer-events: none;
  }
  #scanFrame.detected { border-color: #4caf50; }
  #hint {
    position: absolute; bottom: 14%; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  #pauseOverlay {
    position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; background: rgba(0,0,0,0.55); text-align: center;
    padding: 20px;
  }
  #pauseOverlay .icon { font-size: 64px; }

  /* toast hasil scan */
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: #fff; color: #111; padding: 16px 24px; border-radius: 14px;
    text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 999; max-width: 320px; width: 88%;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok { background: #e6f4ea; }
  #toast.fail { background: #fce8e6; }
  #toastIcon { font-size: 48px; }
  #toastStatus { font-weight: 800; font-size: 19px; margin-top: 6px; letter-spacing: 0.3px; line-height: 1.3; }

  #logoutBtn {
    background: none; border: none; color: #aaa; font-size: 20px; padding: 6px 10px;
    cursor: pointer;
  }

  canvas.hidden { display: none; }
</style>
</head>
<body>

  <!-- ================= LOGIN / KONFIGURASI ================= -->
  <div id="loginBox">
    <h2>📷 Live Scanner Absensi</h2>
    <p style="color:#999;font-size:13px;">Halaman ini terpisah dari Apps Script — hanya bicara ke Web App lewat API.</p>
    <input type="text" id="webAppUrl" placeholder="URL Web App (…/exec)" autocomplete="off">
    <input type="password" id="password" placeholder="Password admin" autocomplete="new-password"
           onkeydown="if(event.key==='Enter') doLogin()">
    <button class="btn" onclick="doLogin()">Masuk & Ambil Daftar Sesi</button>
    <div id="loginError"></div>
  </div>

  <!-- ================= SCANNER ================= -->
  <div id="scannerApp">
    <div id="topBar">
      <button id="logoutBtn" onclick="doLogout()" title="Keluar">←</button>
      <select id="sesiSelect"><option value="">-- Pilih Sesi --</option></select>
      <select id="angkatanSelect"><option value="">-- Pilih Angkatan --</option></select>
      <div class="counter">Hadir<br><b id="scanCounter">0</b></div>
    </div>

    <div id="cameraWrap">
      <video id="video" autoplay playsinline muted></video>
      <div id="scanFrame"></div>
      <div id="hint">Arahkan kamera ke QR code peserta</div>
      <div id="pauseOverlay">
        <div>
          <div class="icon">⏸️</div>
          <div>Pilih sesi &amp; angkatan dulu untuk mulai scan</div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="canvas" class="hidden"></canvas>

  <div id="toast">
    <div id="toastIcon"></div>
    <div id="toastStatus"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    // ============================================================
    // STATE
    // ============================================================
    var WEB_APP_URL = '';
    var PASSWORD = '';
    var stream = null;
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var scanning = false;
    var rafId = null;
    var scanCount = 0;
    var lastScanTime = {};      // pesertaId -> timestamp scan terakhir
    var COOLDOWN_MS = 6000;     // jangan proses ID yang sama dalam 6 detik
    var busy = false;           // true selagi menunggu respons server (blokir scan baru)

    // ============================================================
    // LOGIN
    // ============================================================
    function doLogin() {
      var url = document.getElementById('webAppUrl').value.trim();
      var pw = document.getElementById('password').value.trim();
      var errBox = document.getElementById('loginError');
      errBox.textContent = '';

      if (!url || url.indexOf('http') !== 0) {
        errBox.textContent = 'Isi URL Web App yang valid (…/exec).';
        return;
      }
      if (!pw) {
        errBox.textContent = 'Isi password admin.';
        return;
      }
      WEB_APP_URL = url.replace(/\/+$/, '');
      PASSWORD = pw;

      errBox.style.color = '#999';
      errBox.textContent = 'Memuat daftar sesi...';

      callApi({ action: 'getLists', password: PASSWORD })
        .then(function (res) {
          if (!res.success) throw new Error(res.message || 'Login gagal.');
          populateSelect('sesiSelect', res.sesiList, function (s) {
            return { value: s.Sesi_ID, label: s.Sesi_ID + ' — ' + s.Nama_Sesi + (s.Status_Aktif ? '' : ' (nonaktif)') };
          });
          populateSelect('angkatanSelect', res.angkatanList, function (a) {
            return { value: a, label: 'Angkatan ' + a };
          });
          document.getElementById('loginBox').style.display = 'none';
          document.getElementById('scannerApp').style.display = 'flex';
          localStorage.setItem('scanLiveUrl', WEB_APP_URL); // hanya URL disimpan, password tidak
          startCamera();
        })
        .catch(function (err) {
          errBox.style.color = '#ff6b6b';
          errBox.textContent = err.message;
        });
    }

    function doLogout() {
      stopCamera();
      PASSWORD = '';
      document.getElementById('password').value = '';
      document.getElementById('scannerApp').style.display = 'none';
      document.getElementById('loginBox').style.display = 'block';
    }

    function populateSelect(id, items, mapFn) {
      var el = document.getElementById(id);
      el.innerHTML = '<option value="">-- Pilih ' + (id === 'sesiSelect' ? 'Sesi' : 'Angkatan') + ' --</option>';
      items.forEach(function (item) {
        var m = mapFn(item);
        var opt = document.createElement('option');
        opt.value = m.value;
        opt.textContent = m.label;
        el.appendChild(opt);
      });
    }

    // muat ulang URL yang pernah dipakai (kalau ada) supaya tidak ketik ulang tiap buka
    window.addEventListener('load', function () {
      var saved = localStorage.getItem('scanLiveUrl');
      if (saved) document.getElementById('webAppUrl').value = saved;
    });

    document.getElementById('sesiSelect').addEventListener('change', updatePauseState);
    document.getElementById('angkatanSelect').addEventListener('change', updatePauseState);
    function updatePauseState() {
      var ready = document.getElementById('sesiSelect').value && document.getElementById('angkatanSelect').value;
      document.getElementById('pauseOverlay').style.display = ready ? 'none' : 'flex';
    }

    // ============================================================
    // KAMERA + LOOP SCAN QR
    // ============================================================
    function startCamera() {
      updatePauseState();
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      }).then(function (s) {
        stream = s;
        video.srcObject = s;
        video.onloadedmetadata = function () {
          video.play();
          scanning = true;
          rafId = requestAnimationFrame(scanLoop);
        };
      }).catch(function (err) {
        alert('Tidak bisa mengakses kamera: ' + err.message + '\n\nPastikan halaman diakses lewat HTTPS dan izin kamera diberikan.');
      });
    }

    function stopCamera() {
      scanning = false;
      if (rafId) cancelAnimationFrame(rafId);
      if (stream) {
        stream.getTracks().forEach(function (t) { t.stop(); });
        stream = null;
      }
    }

    var lastFrameTime = 0;
    function scanLoop(ts) {
      if (!scanning) return;
      // throttle ke ~8 fps cukup untuk decode QR, hemat CPU/baterai
      if (ts - lastFrameTime > 120 && video.readyState === video.HAVE_ENOUGH_DATA) {
        lastFrameTime = ts;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data) {
          handleDetected(code.data);
        }
      }
      rafId = requestAnimationFrame(scanLoop);
    }

    function handleDetected(rawValue) {
      var sesiId = document.getElementById('sesiSelect').value;
      var angkatan = document.getElementById('angkatanSelect').value;
      if (!sesiId || !angkatan) return; // belum siap, abaikan

      var pesertaId = parsePesertaId(rawValue);
      var now = Date.now();
      if (busy) return;
      if (lastScanTime[pesertaId] && (now - lastScanTime[pesertaId]) < COOLDOWN_MS) return;

      lastScanTime[pesertaId] = now;
      busy = true;
      flashFrame(true);
      showToast(true);
      beep(true);

      // Ambil foto dari frame video SAAT INI (bukan canvas hasil decode, sudah sama isinya)
      var photoBase64 = capturePhoto();

      callApi({
        action: 'scanQR',
        password: PASSWORD,
        sesiId: sesiId,
        pesertaId: pesertaId,
        photoBase64: photoBase64,
        angkatan: angkatan
      }).then(function (res) {
        if (res.success) {
          scanCount++;
          document.getElementById('scanCounter').textContent = scanCount;
        } else if (res.code === 'SESI_BELUM_MULAI') {
          // timpa notifikasi BERHASIL yang sudah tampil, jelaskan berapa menit lagi
          var menit = res.minutesLeft;
          var label = (menit && menit > 0)
            ? 'DITOLAK: Bisa Scan ' + menit + ' Menit Lagi'
            : 'DITOLAK: Sesi Belum Mulai';
          showToast(false, label);
          beep(false);
        } else {
          // Sengaja tidak ditampilkan ke layar (sesuai permintaan: cukup BERHASIL saja).
          // Tetap dicatat di console untuk keperluan debug kalau dibutuhkan panitia teknis.
          console.warn('Scan tidak tersimpan:', res.message);
        }
      }).catch(function (err) {
        console.warn('Gagal kirim ke server:', err.message);
        // biar bisa dicoba lagi lebih cepat kalau errornya jaringan
        lastScanTime[pesertaId] = 0;
      }).finally(function () {
        busy = false;
        flashFrame(false);
      });
    }

    function parsePesertaId(text) {
      text = String(text).trim();
      var idx = text.indexOf('peserta=');
      if (idx !== -1) {
        var part = text.substring(idx + 'peserta='.length).split('&')[0];
        try { part = decodeURIComponent(part); } catch (e) {}
        return part;
      }
      return text;
    }

    function capturePhoto() {
      // kompres: max lebar 480px, JPEG 0.6 — sama seperti Form.html peserta
      var maxW = 480;
      var scale = Math.min(1, maxW / canvas.width);
      var outW = Math.round(canvas.width * scale);
      var outH = Math.round(canvas.height * scale);
      var outCanvas = document.createElement('canvas');
      outCanvas.width = outW;
      outCanvas.height = outH;
      outCanvas.getContext('2d').drawImage(canvas, 0, 0, outW, outH);
      return outCanvas.toDataURL('image/jpeg', 0.6);
    }

    function flashFrame(on) {
      document.getElementById('scanFrame').classList.toggle('detected', on);
    }

    // ============================================================
    // API CALL — pakai Content-Type text/plain supaya tidak kena
    // CORS preflight (Apps Script tidak support OPTIONS request)
    // ============================================================
    function callApi(payload) {
      return fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }

    // ============================================================
    // TOAST + BUNYI
    // ============================================================
    var toastTimer = null;
    function showToast(success, label) {
      var box = document.getElementById('toast');
      clearTimeout(toastTimer);
      box.className = 'show ' + (success ? 'ok' : 'fail');
      document.getElementById('toastIcon').textContent = success ? '✅' : '❌';
      document.getElementById('toastStatus').textContent = label || (success ? 'BERHASIL' : 'GAGAL');
      toastTimer = setTimeout(function () { box.classList.remove('show'); }, success ? 1800 : 2800);
    }

    var audioCtx = null;
    function beep(success) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (success) {
          // dua nada cepat berturut-turut, nyaring & jelas terdengar di lokasi ramai
          playTone(1046, 0.09, 0);      // C6
          playTone(1568, 0.14, 0.1);    // G6
        } else {
          playTone(160, 0.35, 0);       // nada rendah panjang untuk gagal
        }
        if (navigator.vibrate) navigator.vibrate(success ? 60 : [80, 60, 80]);
      } catch (e) { /* audio tidak wajib, abaikan kalau gagal */ }
    }

    function playTone(freq, durationSec, delaySec) {
      var startTime = audioCtx.currentTime + delaySec;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'square';           // lebih nyaring & tegas dibanding sine
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, startTime);
      g.gain.exponentialRampToValueAtTime(0.9, startTime + 0.01); // volume besar
      g.gain.exponentialRampToValueAtTime(0.0001, startTime + durationSec);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(startTime);
      o.stop(startTime + durationSec + 0.02);
    }

    window.addEventListener('beforeunload', stopCamera);
  </script>
</body>
</html>
